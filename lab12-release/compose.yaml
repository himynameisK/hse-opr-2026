name: opr-lab12
services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-only-password
      POSTGRES_DB: shop
    volumes:
      - db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab -d shop]
      interval: 3s
      retries: 30
    mem_limit: 384m
  shop:
    build: ./app
    environment:
      DATABASE_URL: postgresql://lab:lab-only-password@db/shop
    ports: ['127.0.0.1:18080:8000']
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30
    mem_limit: 256m
  traffic:
    build: ./app
    command: [python, traffic.py]
    depends_on:
      shop: {condition: service_healthy}
    mem_limit: 96m
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=24h']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports: ['127.0.0.1:19090:9090']
    mem_limit: 384m
  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: teacher
      GF_SECURITY_ADMIN_PASSWORD: lab-only-password
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:13000:3000']
    mem_limit: 384m
  metabase:
    image: metabase/metabase:v0.53.5
    platform: linux/amd64
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: lab
      MB_DB_PASS: lab-only-password
      MB_DB_HOST: db
      MB_ANON_TRACKING_ENABLED: 'false'
      JAVA_OPTS: -Xmx1024m
    ports: ['127.0.0.1:13001:3000']
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 1536m
volumes:
  db:
  prometheus:
